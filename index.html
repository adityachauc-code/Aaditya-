<!DOCTYPE html>
<html>
<head>
  <title>My Love ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #18001f, #50002f);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial;
      color: white;
    }

    .box {
      text-align: center;
      z-index: 2;
    }

    h1 {
      font-size: 60px;
      text-shadow: 0 0 20px pink;
    }

    p {
      font-size: 20px;
    }

    .emoji {
      position: absolute;
      bottom: -50px;
      font-size: 30px;
      animation: fly 6s linear forwards;
      pointer-events: none;
    }

    @keyframes fly {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>My Love ❤️</h1>
    <p>You are special to me 😊💖</p>
  </div>

  <script>
    function createEmoji() {

      const emoji = document.createElement("div");
      emoji.className = "emoji";

      const emojis = [
        "❤️", "💗", "💕", "💖", "💜",
        "😊", "😄", "😁", "🥰", "😍",
        "😎", "🤗", "🥳", "✨", "🌸",
        "🌟", "🫶", "💫", "🌈", "🎀"
      ];

      emoji.innerHTML =
        emojis[Math.floor(Math.random() * emojis.length)];

      emoji.style.left =
        Math.random() * 100 + "vw";

      emoji.style.fontSize =
        (15 + Math.random() * 30) + "px";

      emoji.style.animationDuration =
        (4 + Math.random() * 5) + "s";

      document.body.appendChild(emoji);

      setTimeout(() => {
        emoji.remove();
      }, 9000);
    }

    setInterval(createEmoji, 400)document.addEventListener("pointerdown", function(event) {
  const emoji = document.createElement("div");

  const emojis = ["😘", "❤️‍🩹", "🥰"];
  emoji.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];

  emoji.style.position = "fixed";
  emoji.style.left = event.clientX + "px";
  emoji.style.top = event.clientY + "px";
  emoji.style.fontSize = "40px";
  emoji.style.pointerEvents = "none";
  emoji.style.zIndex = "999";

  document.body.appendChild(emoji);

  emoji.animate(
    [
      {
        transform: "translate(-50%, -50%) scale(0.5)",
        opacity: 0
      },
      {
        transform: "translate(-50%, -100%) scale(1.3)",
        opacity: 1
      },
      {
        transform: "translate(-50%, -180%) scale(1)",
        opacity: 0
      }
    ],
    {
      duration: 2000,
      easing: "ease-out"
    }
  );

  setTimeout(() => {
    emoji.remove();
  }, 2000);
});
  </script>

</body>
</html>
