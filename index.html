    <!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>My Love ❤️</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;

      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;
      color: white;

      background:
        radial-gradient(
          circle at 20% 20%,
          #ff4f81 0%,
          transparent 30%
        ),

        radial-gradient(
          circle at 80% 80%,
          #7b2cff 0%,
          transparent 35%
        ),

        linear-gradient(
          135deg,
          #16001f,
          #3b082f,
          #12001d
        );
    }


    /* MAIN BOX */

    .container {
      width: 90%;
      max-width: 650px;

      padding: 45px 25px;

      border-radius: 30px;

      background: rgba(255,255,255,0.10);

      border: 1px solid rgba(255,255,255,0.25);

      backdrop-filter: blur(12px);

      box-shadow:
        0 0 40px rgba(255,70,150,0.35);

      animation: appear 1.5s ease;

      z-index: 2;
    }


    /* MAIN HEART */

    .heart {
      font-size: 75px;

      animation:
        heartbeat 1.2s infinite;

      filter:
        drop-shadow(
          0 0 18px #ff4f91
        );
    }


    /* TITLE */

    h1 {
      margin-top: 15px;

      font-size:
        clamp(42px, 12vw, 75px);

      text-shadow:
        0 0 15px #ff4f91,
        0 0 35px #ff1f75;
    }


    /* MESSAGE */

    .message {
      margin-top: 20px;

      font-size: 20px;

      line-height: 1.7;

      color: #ffe8f2;
    }


    .small {
      margin-top: 25px;

      font-size: 14px;

      opacity: 0.8;
    }


    /* FLOATING EMOJIS */

    .floating-emoji {
      position: absolute;

      bottom: -50px;

      font-size: 25px;

      animation:
        floatUp linear forwards;

      opacity: 0.8;

      pointer-events: none;

      z-index: 1;
    }


    /* TOUCH EMOJI */

    .touch-emoji {
      position: fixed;

      pointer-events: none;

      z-index: 999;

      font-size: 40px;
    }


    /* HEARTBEAT */

    @keyframes heartbeat {

      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.18);
      }

    }


    /* FLOAT UP */

    @keyframes floatUp {

      from {
        transform:
          translateY(0)
          rotate(0deg);

        opacity: 0;
      }

      15% {
        opacity: 0.9;
      }

      to {
        transform:
          translateY(-110vh)
          rotate(360deg);

        opacity: 0;
      }

    }


    /* BOX APPEAR */

    @keyframes appear {

      from {
        opacity: 0;

        transform:
          scale(0.8)
          translateY(30px);
      }

      to {
        opacity: 1;

        transform:
          scale(1)
          translateY(0);
      }

    }

  </style>

</head>


<body>


  <!-- MAIN CONTENT -->

  <div class="container">

    <div class="heart">
      ❤️
    </div>

    <h1>
      My Love
    </h1>

    <p class="message">
      You are a beautiful part of my thoughts. ❤️
      <br>
      Some feelings are too special to explain with words.
    </p>

    <p class="small">
      Made with ❤️
    </p>

  </div>



  <script>


    /* FLOATING EMOJIS */

    function createEmoji() {

      const emoji =
        document.createElement("div");

      emoji.className =
        "floating-emoji";


      const emojis = [

        "❤️",
        "💗",
        "💕",
        "💖",
        "💜",

        "😊",
        "😄",
        "😁",
        "🥰",
        "😍",

        "😎",
        "🤗",
        "🥳",

        "✨",
        "🌸",
        "🌟",

        "🫶",
        "💫",
        "🌈",
        "🎀"

      ];


      emoji.innerHTML =
        emojis[
          Math.floor(
            Math.random() *
            emojis.length
          )
        ];


      emoji.style.left =
        Math.random() * 100 + "vw";


      emoji.style.fontSize =
        (15 + Math.random() * 30)
        + "px";


      emoji.style.animationDuration =
        (4 + Math.random() * 5)
        + "s";


      document.body.appendChild(
        emoji
      );


      setTimeout(() => {

        emoji.remove();

      }, 9000);

    }


    /* CREATE FLOATING EMOJI */

    setInterval(
      createEmoji,
      400
    );



    /* TOUCH ANIMATION */

    document.addEventListener(
      "pointerdown",
      function(event) {


        const emoji =
          document.createElement("div");


        /* ONLY THESE THREE */

        const touchEmojis = [

          "😘",
          "❤️‍🩹",
          "🥰"

        ];


        emoji.innerHTML =
          touchEmojis[
            Math.floor(
              Math.random() *
              touchEmojis.length
            )
          ];


        emoji.className =
          "touch-emoji";


        emoji.style.left =
          event.clientX + "px";


        emoji.style.top =
          event.clientY + "px";


        document.body.appendChild(
          emoji
        );


        /* ANIMATION */

        emoji.animate(

          [

            {
              transform:
                "translate(-50%, -50%) scale(0.3)",

              opacity: 0
            },


            {
              transform:
                "translate(-50%, -100%) scale(1.4)",

              opacity: 1
            },


            {
              transform:
                "translate(-50%, -200%) scale(1)",

              opacity: 0
            }

          ],

          {

            duration: 2000,

            easing: "ease-out"

          }

        );


        /* REMOVE AFTER 2 SECONDS */

        setTimeout(() => {

          emoji.remove();

        }, 2000);


      }

    );


  </script>


</body>

</html>
