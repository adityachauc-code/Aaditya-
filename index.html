<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Love</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff0f5,#f8e8ff);display:flex;justify-content:center;padding:28px 14px;color:#3b2630}
.app{width:min(850px,100%)}
h1{text-align:center;font-size:34px;margin:10px 0 6px}
.sub{text-align:center;color:#876b76;margin-bottom:22px}
textarea{width:100%;min-height:58vh;border:0;border-radius:18px;padding:20px;background:#fff;box-shadow:0 8px 30px #00000012;font-size:17px;line-height:1.6;outline:none;resize:vertical}
.buttons{display:flex;gap:10px;margin-top:12px}
button{flex:1;border:0;border-radius:12px;padding:14px;font-size:15px;cursor:pointer;background:#9b5274;color:white}
button.clear{background:#b8a5ad}
#status{text-align:center;margin-top:10px;color:#876b76;font-size:14px}
</style>
</head>
<body>
<div class="app">
<h1>My Love ♡</h1>
<div class="sub">A little place for your thoughts</div>
<textarea id="notes" placeholder="Write your thoughts here..."></textarea>
<div class="buttons">
<button onclick="save()">Save</button>
<button class="clear" onclick="clearNotes()">Clear</button>
</div>
<div id="status">Saved in this browser.</div>
</div>
<script>
const notes=document.getElementById('notes'),status=document.getElementById('status');
notes.value=localStorage.getItem('myLoveNotes')||'';
function save(){localStorage.setItem('myLoveNotes',notes.value);status.textContent='Saved ✓';}
function clearNotes(){if(confirm('Clear your saved writing?')){notes.value='';localStorage.removeItem('myLoveNotes');status.textContent='Cleared.';}}
</script>
</body>
</html>
