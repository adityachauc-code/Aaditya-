<!DOCTYPE html>
<html>
<head>
  <title>My Love ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #25002e, #7b145f);
      color: white;
      font-family: Arial;
      text-align: center;
    }

    .box {
      position: relative;
      z-index: 10;
      margin-top: 150px;
    }

    .main-heart {
      font-size: 70px;
      animation: beat 1s infinite;
    }

    h1 {
      font-size: 55px;
    }

    p {
      font-size: 20px;
    }

    .emoji {
      position: fixed;
      pointer-events: none;
      z-index: 20;
      animation: fly 4s linear forwards;
    }

    @keyframes beat {
      50% {
        transform: scale(1.2);
      }
    }

    @keyframes fly {
      0% {
        transform: translateY(0);
        opacity: 1;
      }

      100% {
        transform: translateY(-100vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="main-heart">❤️</div>

    <h1>My Love</h1>

    <p>
      You are a beautiful part of my thoughts. ❤️
    </p>

    <p>
      Some feelings are too special to explain with words.
    </p>

  </div>


  <script>

    /* FLOATING EMOJIS */

    function makeEmoji() {

      let emoji = document.createElement("div");

      let list = [
        "❤️",
        "💗",
        "💕",
        "💖",
        "💜",
        "😊",
        "😄",
        "🥰",
        "😍",
        "✨",
        "🌸",
        "🌟",
        "🥳"
      ];

      emoji.innerText =
        list[Math.floor(Math.random() * list.length)];

      emoji.className = "emoji";

      emoji.style.left =
        Math.random() * 100 + "vw";

      emoji.style.bottom = "0px";

      emoji.style.fontSize =
        20 + Math.random() * 30 + "px";

      document.body.appendChild(emoji);

      setTimeout(function() {
        emoji.remove();
      }, 4000);
    }


    /* NEW EMOJI EVERY HALF SECOND */

    setInterval(makeEmoji, 500);


    /* TOUCH ANIMATION */

    document.addEventListener("pointerdown", function(event) {

      let touch = document.createElement("div");

      let touchList = [
        "😘",
        "❤️‍🩹",
        "🥰"
      ];

      touch.innerText =
        touchList[
          Math.floor(
            Math.random() * touchList.length
          )
        ];

      touch.style.position = "fixed";
      touch.style.left = event.clientX + "px";
      touch.style.top = event.clientY + "px";
      touch.style.fontSize = "45px";
      touch.style.zIndex = "100";
      touch.style.pointerEvents = "none";

      document.body.appendChild(touch);

      let animation =
        touch.animate(
          [
            {
              transform: "translate(-50%, -50%) scale(0.5)",
              opacity: 0
            },

            {
              transform: "translate(-50%, -100%) scale(1.3)",
              opacity: 1
            },

            {
              transform: "translate(-50%, -200%) scale(1)",
              opacity: 0
            }
          ],
          {
            duration: 2000,
            easing: "ease-out"
          }
        );

      animation.onfinish = function() {
        touch.remove();
      };

    });

  </script>

</body>
</html>
